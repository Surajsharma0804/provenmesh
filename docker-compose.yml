# ProvenMesh — Docker Compose for local development
# Services: PostgreSQL (+ pgvector), Redis, MinIO (S3-compatible)
# Scale workers: docker compose up --scale crawler-worker=N

services:
  # ─── Data Stores ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: provenmesh-postgres
    environment:
      POSTGRES_USER: provenmesh
      POSTGRES_PASSWORD: provenmesh_dev
      POSTGRES_DB: provenmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenmesh"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: provenmesh-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  minio:
    image: minio/minio:latest
    container_name: provenmesh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: provenmesh
      MINIO_ROOT_PASSWORD: provenmesh_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Create MinIO bucket on startup ─────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: provenmesh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 provenmesh provenmesh_dev;
      mc mb --ignore-existing local/provenmesh-raw;
      mc anonymous set download local/provenmesh-raw;
      echo 'Bucket provenmesh-raw ready';
      "

  # ─── Workers ────────────────────────────────────────────────────
  crawler-worker:
    profiles: [workers]   # Only starts with: docker compose --profile workers up -d
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m provenmesh.workers.crawl_worker
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql+asyncpg://provenmesh:provenmesh_dev@postgres:5432/provenmesh
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=provenmesh-raw
      - S3_ACCESS_KEY=provenmesh
      - S3_SECRET_KEY=provenmesh_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  extraction-worker:
    profiles: [workers]
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m provenmesh.workers.extraction_worker
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql+asyncpg://provenmesh:provenmesh_dev@postgres:5432/provenmesh
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=provenmesh-raw
      - S3_ACCESS_KEY=provenmesh
      - S3_SECRET_KEY=provenmesh_dev
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  resolver-worker:
    profiles: [workers]
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m provenmesh.workers.resolver_worker
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql+asyncpg://provenmesh:provenmesh_dev@postgres:5432/provenmesh
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  export-worker:
    profiles: [workers]
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m provenmesh.workers.export_worker
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql+asyncpg://provenmesh:provenmesh_dev@postgres:5432/provenmesh
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: provenmesh-network
