[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provenmesh"
version = "1.0.0"
description = "Evidence-first, idempotent, async distributed ingestion pipeline for GraphOne/FrontierAtlas Intelligence Graph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Suraj Sharma" }]

dependencies = [
    # Async HTTP & Browser
    "aiohttp>=3.9,<4.0",
    "aiofiles>=24.1",
    "playwright>=1.45",

    # Queue & Cache
    "redis[hiredis]>=5.0,<6.0",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # S3 / Object Store
    "aiobotocore>=2.13",

    # LLM Providers
    "google-generativeai>=0.7",
    "groq>=0.9",
    "openai>=1.35",        # DeepSeek uses OpenAI-compatible API

    # NLP & Matching
    "rapidfuzz>=3.9",
    "sentence-transformers>=3.0",
    "numpy>=1.26,<3.0",

    # Data Validation & Parsing
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.3",
    "jsonschema>=4.22",
    "python-dateutil>=2.9",
    "dateparser>=1.2",

    # HTML Processing
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "lxml>=5.2",
    "tiktoken>=0.7",

    # Google Sheets Export
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",

    # Observability
    "structlog>=24.2",
    "prometheus-client>=0.20",

    # Security
    "python-dotenv>=1.0",

    # Utilities
    "pyyaml>=6.0",
    "tenacity>=8.4",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-mock>=3.14",
    "fakeredis>=2.23",
    "testcontainers>=4.5",
    "aioresponses>=0.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",          # For test client
]

[project.scripts]
provenmesh = "provenmesh.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/provenmesh"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "DTZ",    # flake8-datetimez
    "LOG",    # flake8-logging
    "PT",     # flake8-pytest-style
]
ignore = [
    "S101",   # Allow assert in tests
    "S608",   # Allow SQL string formatting (SQLAlchemy)
]

[tool.ruff.lint.per-file-ignores]
"src/provenmesh/extraction/prompts.py" = ["E501"]
"src/provenmesh/config/constants.py" = ["E501"]
"tests/fixtures/samples.py" = ["E501"]
"tests/e2e/test_pipeline.py" = ["E501"]
"tests/**/*.py" = ["RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["provenmesh"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["redis.*", "playwright.*", "aiobotocore.*", "readability.*", "tiktoken.*", "groq.*", "google.*", "rapidfuzz.*", "sentence_transformers.*", "dateparser.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Docker services)",
    "contract: Contract tests (verify provider interfaces)",
    "e2e: End-to-end pipeline tests",
    "slow: Slow tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/provenmesh"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/workers/*",
    "*/crawler/browser.py",
    "*/crawler/fetcher.py",
    "*/crawler/producers/*",
    "*/crawler/robots.py",
    "*/crawler/http_client.py",
    "*/crawler/dedup.py",
    "*/crawler/rate_limiter.py",
    "*/storage/*",
    "*/raw_store/s3.py",
    "*/export/sheets.py",
    "*/extraction/orchestrator.py",
    "*/extraction/cache.py",
    "*/extraction/cost_guard.py",
    "*/extraction/providers/gemini.py",
    "*/extraction/providers/groq.py",
    "*/extraction/providers/deepseek.py",
    "*/queue/consumer.py",
    "*/queue/producer.py",
    "*/queue/dlq.py",
    "*/queue/streams.py",
    "*/graph/repository.py",
    "*/resolver/review_queue.py",
    "*/resolver/embeddings.py",
    "*/observability/health.py",
    "*/main.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "@abc.abstractmethod",
    "@abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",
]

