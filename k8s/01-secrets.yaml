# ProvenMesh — Secrets
# IMPORTANT: Replace ALL placeholder values before deploying!
# Generate base64: echo -n "your_value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: provenmesh-secrets
  namespace: provenmesh
  labels:
    app: provenmesh
type: Opaque
data:
  # Database (change these!)
  POSTGRES_PASSWORD: cHJvdmVubWVzaF9wcm9k  # provenmesh_prod
  POSTGRES_USER: cHJvdmVubWVzaA==          # provenmesh
  POSTGRES_DB: cHJvdmVubWVzaA==            # provenmesh

  # S3/MinIO
  S3_ACCESS_KEY: cHJvdmVubWVzaA==          # provenmesh
  S3_SECRET_KEY: cHJvdmVubWVzaF9wcm9k      # provenmesh_prod

  # LLM API Keys (MUST replace these with your real keys)
  GEMINI_API_KEY: REPLACE_WITH_BASE64_ENCODED_KEY
  GROQ_API_KEY: REPLACE_WITH_BASE64_ENCODED_KEY

  # Google Sheets (MUST replace)
  GOOGLE_SHEETS_SPREADSHEET_ID: REPLACE_WITH_BASE64_ENCODED_ID

---
# Google Sheets service account credentials (JSON file)
apiVersion: v1
kind: Secret
metadata:
  name: google-sheets-credentials
  namespace: provenmesh
  labels:
    app: provenmesh
type: Opaque
data:
  service_account.json: REPLACE_WITH_BASE64_ENCODED_JSON_FILE
