# ProvenMesh — Structured Logging Configuration (PDF §10.1)

version: 1
disable_existing_loggers: false

formatters:
  json:
    class: provenmesh.observability.logging.JSONFormatter
    format: "%(message)s"

  console:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout

  json_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/provenmesh.jsonl
    maxBytes: 52428800        # 50 MB
    backupCount: 10
    encoding: utf-8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: json
    filename: logs/provenmesh-errors.jsonl
    maxBytes: 10485760        # 10 MB
    backupCount: 5
    encoding: utf-8

loggers:
  provenmesh:
    level: DEBUG
    handlers: [console, json_file, error_file]
    propagate: false

  provenmesh.crawler:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  provenmesh.extraction:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  provenmesh.grounding:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  provenmesh.resolver:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  provenmesh.export:
    level: INFO
    handlers: [console, json_file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
